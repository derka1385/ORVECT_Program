name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Install locked dependencies and application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.lock -r requirements-firebase.txt
          python -m pip install --no-deps .
      - name: Compile and verify packaged prompt
        run: |
          python -m compileall -q app
          python -c "from importlib.resources import files; assert files('app.modules.diagnostic_ai').joinpath('prompts/automotive_v1.txt').read_text()"
          python ../scripts/sanitize_dtc_catalog.py ../data/fixtures/dtc_catalog.json --check
      - name: Run migrations and seed on a fresh database
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Run backend tests
        run: pytest
      - name: Audit production and test dependencies
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip
          pip-audit -r requirements-test.lock --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  docker-runtime:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: Build and start PostgreSQL, backend and frontend
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Check PostgreSQL migrations and ORM consistency
        run: |
          docker compose exec -T backend alembic current
          docker compose exec -T backend alembic check
      - name: Exercise login, vehicle CRUD and diagnostic through the frontend proxy
        run: python scripts/smoke_local_runtime.py
      - name: Verify a second startup remains operational
        run: |
          docker compose restart backend frontend
          docker compose up -d --wait --wait-timeout 120
          python scripts/smoke_local_runtime.py
      - name: Runtime logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop CI containers (volumes retained until runner cleanup)
        if: always()
        run: docker compose down
